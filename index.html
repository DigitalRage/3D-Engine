<!DOCTYPE html>
<html>
<head>
    <title>Flat Shaded 3D Engine</title>
    <style>
        body { margin: 0; overflow: hidden; background: #1a1a26; }
        #viewport { width: 100vw; height: 100vh; display: block; background: #1a1a26; }
        #viewport-overlay { position: fixed; inset: 0; z-index: 2; width: 100vw; height: 100vh; pointer-events: none; }
        #ui-root { position: absolute; top: 0; left: 0; right: 0; pointer-events: none; }
    </style>
</head>
<body>
    <canvas id="viewport"></canvas>
    <canvas id="viewport-overlay" aria-hidden="true"></canvas>
    <div id="ui-root"></div>
    <script type="module" src="./main.js"></script>
</body>
</html>
